# Serve a landing. Este container só é alcançado pela rede interna Docker (o
# nginx de borda em ../nginx/ é quem termina TLS e fica exposto na EC2).
#
# Os arquivos vivem em /usr/share/nginx/html/landing/ porque o nginx de borda
# repassa o caminho completo (`/landing/...`), e o build do Vite também emite
# os assets com esse prefixo — os dois lados combinam sem reescrita de URL.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A landing é uma página só (âncoras, não rotas), mas manter o fallback
    # evita 404 se alguém digitar /landing/qualquer-coisa vindo de um link
    # antigo ou de um QR impresso errado.
    location /landing/ {
        try_files $uri $uri/ /landing/index.html;
    }

    # Assets versionados por hash no nome: podem ser cacheados para sempre.
    # As fontes e os .glb não têm hash (vêm de public/), então ficam de fora —
    # um cache eterno neles atrapalharia trocar a arte no meio do evento.
    location /landing/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
