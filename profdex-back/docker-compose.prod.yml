# Sobe o backend + Postgres na instância (produção/AWS).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferente do docker-compose.yml (só banco, para dev local), este arquivo
# também builda e sobe a API a partir do Dockerfile.
#
# Pré-requisito: um `.env` nesta pasta (profdex-back/) com as variáveis de
# produção. Importante: como o Postgres aqui roda no serviço `db` da mesma
# rede Docker, DATABASE_URL/DIRECT_URL devem apontar para o host `db` na
# porta interna 5432 (não `localhost:55432`, que é só o mapeamento pro host):
#
#   DATABASE_URL="postgresql://profdex:profdex@db:5432/profdex"
#   DIRECT_URL="postgresql://profdex:profdex@db:5432/profdex"
#
# O Postgres fica exposto só em 127.0.0.1 no host — não fica acessível pela
# internet pública da instância.
#
# HTTPS: nginx termina TLS com um Origin Certificate do Cloudflare (modo Full
# Strict) — sem Let's Encrypt/Certbot envolvido. Gere o certificado no painel
# Cloudflare (SSL/TLS → Origin Server → Create Certificate) e salve os dois
# arquivos em `nginx/certs/` nesta pasta:
#
#   nginx/certs/cert.pem   (certificado)
#   nginx/certs/key.pem    (chave privada — NUNCA commitar, já está no .gitignore)
#
# Defina DOMAIN no `.env` com o hostname usado no certificado, aponte o
# registro DNS no Cloudflare (proxy "laranja" ligado) pro IP público da
# instância, e libere a porta 443 (e opcionalmente 80) no security group.
services:
  db:
    image: postgres:16-alpine
    container_name: profdex-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profdex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profdex}
      POSTGRES_DB: ${POSTGRES_DB:-profdex}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - profdex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-profdex} -d ${POSTGRES_DB:-profdex}',
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profdex-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '3000:3000'

  nginx:
    image: nginx:1.27-alpine
    container_name: profdex-nginx
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  profdex-pgdata:
