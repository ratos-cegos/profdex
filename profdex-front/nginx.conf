# Serve a SPA. Este container só é alcançado pela rede interna Docker (o
# nginx de borda em ../nginx/ é quem termina TLS e fica exposto na EC2).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O service worker é quem decide se o PWA tem versão nova: o navegador
    # baixa o sw.js de novo e compara byte a byte. Sem Cache-Control aqui, o
    # Cloudflare trata o arquivo como um .js qualquer e guarda por horas — e
    # o app instalado continua na versão velha mesmo depois do deploy, sem
    # nem mostrar o aviso de atualização. Foi o que aconteceu em 01/10/2026:
    # a borda servia o sw.js das 15:29 enquanto o build das 20:41 estava no ar.
    # `no-cache` não proíbe guardar, só obriga a revalidar (o ETag continua
    # valendo, então a resposta costuma ser um 304 vazio).
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Preserva o roteamento interno do Vue Router: acessos diretos a
    # /profile, /ranking, /events etc. caem no index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
